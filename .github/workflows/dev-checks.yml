name: Dev checks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Foundry Guardian
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi

          pattern='^(feat|fix|data|ui|docs|ci|refactor|chore|release)(\([a-zA-Z0-9._-]+\))?: .+'

          failed=0
          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            [[ "$subject" =~ ^Merge[[:space:]] ]] && continue

            if [[ ! "$subject" =~ $pattern ]]; then
              echo "::error::Commit non conforme: $subject"
              failed=1
            fi
          done < <(git log --format='%s' "$RANGE")

          if [[ "$failed" -ne 0 ]]; then
            echo "Format attendu : type: description ou type(scope): description"
            exit 1
          fi

      - name: Validate manifest
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          if (!m.id || !m.version) throw new Error('module.json invalide');
          if (m.id !== 'foundry-guardian') throw new Error(`ID inattendu: ${m.id}`);
          console.log(m.id, m.version);
          NODE

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      - name: Validate JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'));"
          node -e "JSON.parse(require('fs').readFileSync('lang/fr.json','utf8'));"
