name: Promote dev to master

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-dev-to-master
  cancel-in-progress: false

jobs:
  validate:
    name: Validate module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate module.json
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('module.json', 'utf8'));
          if (!m.id || !m.version) throw new Error('module.json invalide');
          if (m.id !== 'foundry-guardian') throw new Error(`ID inattendu: ${m.id}`);
          console.log(m.id, m.version);
          NODE

      - name: Check JavaScript syntax
        run: node --check scripts/main.js

      - name: Validate JSON files
        run: node -e "JSON.parse(require('fs').readFileSync('lang/fr.json','utf8'));"

  promote:
    name: Fast-forward dev to master
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Promote only if master is an ancestor of dev
        run: |
          git fetch origin dev master
          git merge-base --is-ancestor origin/master origin/dev || {
            echo "::error::master a divergé de dev. Fusion automatique refusée.";
            exit 1;
          }
          git push origin origin/dev:refs/heads/master
